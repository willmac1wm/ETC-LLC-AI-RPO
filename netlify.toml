[build]
  publish = "public"
  command = ""

[build.environment]
  # Set ATC_API_URL to your Render deployment URL in the Netlify dashboard
  # e.g. https://atc-ai-rpo-api.onrender.com
  ATC_API_URL = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
